    <meta name="description" content="No surprises. Know the answer.">

    <meta property="og:image" content="https://liquidityradar.io/assets/og-image.png">

    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Liquidity Radar · Know your liquidity at risk.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Liquidity Radar · Know your liquidity at risk.">
    <meta name="twitter:description" content="No surprises. Know the answer.">

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <header class="masthead">
        <a class="brand" href="/" aria-label="Liquidity Radar home">
          <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
            <circle cx="20" cy="20" r="17.5" />
            <circle cx="20" cy="20" r="10.5" />
            <circle cx="20" cy="20" r="2.25" class="solid" />
            <path d="M20 20 31.8 8.2" />
          </svg>
          <span>Liquidity Radar</span>
        </a>
        <span class="status"><i></i> Built in <strong>Abu Dhabi</strong> for family offices globally</span>
      </header>

      <section class="hero" aria-labelledby="headline">
        <div class="copy">
          <p class="eyebrow">Whole-balance-sheet forecasting</p>
          <h1 id="headline">Know your<br><em>liquidity at risk.</em></h1>
          <p class="intro">No surprises. Know the answer.</p>
          <div class="actions">
            <button class="primary" type="button" data-video-open aria-haspopup="dialog">
              <span>Watch the 90-second demo</span><span aria-hidden="true">▶</span>
            </button>
            <a class="contact" href="mailto:info@liquidityradar.io">info@liquidityradar.io</a>
          </div>
        </div>

        <div class="radar" aria-hidden="true">
          <div class="radar-grid"></div>
          <div class="sweep"></div>
          <span class="signal signal-a"></span>
          <span class="signal signal-b"></span>
          <span class="signal signal-c"></span>
          <div class="radar-label label-a"><i></i>Liquid</div>
          <div class="radar-label label-b"><i></i>Committed</div>
          <div class="radar-label label-c"><i></i>At risk</div>
        </div>
      </section>

      <footer>
        <span>Liquidity Radar</span>
        <span>Private capital, made visible.</span>
      </footer>
    </main>

    <dialog class="video-dialog" aria-labelledby="video-title">
      <div class="video-shell">
        <div class="video-bar">
          <div>
            <span class="video-kicker">Liquidity Radar</span>
            <h2 id="video-title">90-second demo</h2>
          </div>
          <button class="video-close" type="button" data-video-close aria-label="Close video">
            <span aria-hidden="true">×</span>
          </button>
        </div>
        <div class="video-frame">
          <video controls preload="metadata" playsinline>
            <source src="assets/lr-demo.mp4" type="video/mp4">
            Your browser does not support embedded video.
            <a href="assets/lr-demo.mp4">Download the Liquidity Radar demo</a>.
          </video>
        </div>
      </div>
    </dialog>
    <script src="video.js" defer></script>
